<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단체문자 보내기</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#f4f6fa; color:#1d2433; }
  header { background:#003D7A; color:#fff; padding:14px 18px; border-bottom:4px solid #C9A227; }
  header h1 { margin:0; font-size:19px; }
  main { padding:16px; max-width:520px; margin:0 auto; }
  .btn { display:block; width:100%; box-sizing:border-box; text-align:center; text-decoration:none; background:#003D7A; color:#fff; border:none; padding:18px; font-size:18px; font-weight:bold; border-radius:10px; margin:10px 0; font-family:inherit; cursor:pointer; }
  .btn.sub { background:#fff; color:#003D7A; border:2px solid #003D7A; font-size:16px; padding:14px; }
  .msg { padding:12px; border-radius:8px; background:#eef3fb; margin:10px 0; font-size:14px; line-height:1.6; }
  .err { background:#fdecea; color:#b42318; }
  ol { padding-left:22px; font-size:15px; line-height:2; }
  ol a { color:#003D7A; }
  textarea { width:100%; box-sizing:border-box; height:90px; font-size:15px; padding:8px; border:1px solid #d8dee9; border-radius:6px; }
</style>
</head>
<body>
<header><h1>단체문자 보내기</h1></header>
<main>
  <div id="info" class="msg">번호를 읽는 중…</div>
  <a id="go" class="btn" href="#" target="_blank" rel="noopener">문자 앱 열기</a>
  <button id="go2" class="btn sub">안 열리면: 문자 앱 열기 (방법 2)</button>
  <button id="cp" class="btn sub">번호 복사</button>
  <div id="cpmsg"></div>
  <div class="msg" style="background:#fff">
    <b>그래도 안 열리면</b> 아래 번호를 하나씩 눌러 보내거나, 문자 앱 받는 사람 칸에 직접 입력하세요.
    <ol id="list"></ol>
  </div>
</main>
<script>
var nums = [];
var IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
function fmt(n) { return n.length === 11 ? n.substr(0, 3) + '-' + n.substr(3, 4) + '-' + n.substr(7) : n.length === 10 ? n.substr(0, 3) + '-' + n.substr(3, 3) + '-' + n.substr(6) : n; }
function link(list) { return IOS ? 'sms:/open?addresses=' + list.join(',') : 'sms:' + list.join(','); }
function load() {
  var h = (location.hash || '').replace(/^#s?/, '');
  nums = h.split('-').filter(function (x) { return /^0\d{8,10}$/.test(x); }).slice(0, 50);
  var info = document.getElementById('info');
  if (!nums.length) {
    info.className = 'msg err';
    info.textContent = '보낼 번호가 없습니다. 매칭 엑셀 파일이나 구글 시트 단체문자 탭의 [문자 보내기] 링크로 들어와 주세요.';
    document.getElementById('go').style.display = 'none';
    document.getElementById('go2').style.display = 'none';
    document.getElementById('cp').style.display = 'none';
    return;
  }
  info.className = 'msg';
  info.innerHTML = '<b>' + nums.length + '명</b>에게 보낼 문자 창을 엽니다. 아래 [문자 앱 열기]를 누르세요.';
  document.getElementById('go').href = link(nums);
  document.getElementById('list').innerHTML = nums.map(function (n) { return '<li><a href="sms:' + n + '" target="_blank" rel="noopener">' + fmt(n) + '</a></li>'; }).join('');
}
document.getElementById('go2').onclick = function () {
  try { window.open(link(nums), '_top'); } catch (e) {}
  try { window.top.location.href = link(nums); } catch (e) { try { location.href = link(nums); } catch (e2) {} }
};
document.getElementById('cp').onclick = async function () {
  var txt = nums.join(','), box = document.getElementById('cpmsg');
  try { await navigator.clipboard.writeText(txt); box.innerHTML = '<div class="msg">복사했습니다. 문자 앱 받는 사람 칸에 붙여넣으세요.</div>'; }
  catch (e) { box.innerHTML = '<div class="msg">아래 칸을 길게 눌러 복사하세요.<textarea readonly>' + txt + '</textarea></div>'; }
};
window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
